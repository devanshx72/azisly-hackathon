<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>PlanetPulse — Part of Future Climate Action</title>
<!-- Google Fonts: Plus Jakarta Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            agroneBg: '#EAE6DA',
            agroneCream: '#F5F2EB',
            agroneCard: '#F5F3EC',
            forestDark: '#0D2117',
            forestGreen: '#132B20',
            limeGreen: '#74C043',
            limeApple: '#72BF44',
            limeLight: '#85D450',
            brickRed: '#B83220',
            warmAmber: '#8C6824',
            sageBg: '#E3EDE5',
            sageBorder: '#C8D9CB',
            mossAccent: '#2F4F2F',
            softLinen: '#F0ECE1',
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          borderRadius: {
            '3xl': '2rem',
            '4xl': '2.5rem',
          }
        }
      }
    }
  </script>
<!-- React and Babel -->
<script crossorigin="" src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin="" src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<!-- Lucide Icons -->
<script src="https://unpkg.com/lucide@latest"></script>
<style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0d2117;
    }
    /* Subtle custom scrollbars */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(245, 242, 235, 0.2);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(19, 43, 32, 0.35);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(19, 43, 32, 0.6);
    }
    .agrone-card-shadow {
      box-shadow: 0 20px 40px -15px rgba(13, 33, 23, 0.28), 0 4px 14px -2px rgba(0, 0, 0, 0.08);
    }
    .agrone-pill-shadow {
      box-shadow: 0 8px 24px -4px rgba(13, 33, 23, 0.22);
    }
    .agrone-input {
      background-color: #ECE8DD;
      border: 1px solid rgba(19, 43, 32, 0.12);
      transition: all 0.2s ease;
    }
    .agrone-input:focus {
      background-color: #FFFFFF;
      border-color: #132B20;
      outline: none;
      box-shadow: 0 0 0 3px rgba(116, 192, 67, 0.25);
    }
    .agrone-modal-backdrop {
      backdrop-filter: blur(10px);
      background-color: rgba(13, 33, 23, 0.55);
    }
  </style>
<script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    const EMISSION_FACTORS = {
      'car': { rate: 0.20, unit: 'km', label: 'Car travel', category: 'Transport', icon: 'car' },
      'bus': { rate: 0.08, unit: 'km', label: 'Bus travel', category: 'Transport', icon: 'bus' },
      'flight': { rate: 0.25, unit: 'km', label: 'Flight', category: 'Transport', icon: 'plane' },
      'electricity': { rate: 0.80, unit: 'kWh', label: 'Electricity', category: 'Energy', icon: 'zap' },
      'veg_meal': { rate: 0.50, unit: 'meal', label: 'Veg meal', category: 'Food', icon: 'salad' },
      'non_veg_meal': { rate: 2.00, unit: 'meal', label: 'Non-veg meal', category: 'Food', icon: 'beef' },
    };

    // Baseline over-threshold data totaling exactly 34.2 kg CO2 for current week
    const INITIAL_ACTIVITIES = [
      {
        id: 'act-overflow',
        type: 'flight',
        quantity: 65,
        date: new Date(Date.now() - 1000 * 60 * 60 * 6).toISOString().split('T')[0],
        emission: 16.25,
        note: 'Regional connector flight (site audit)',
        isBreachTrigger: true
      },
      {
        id: 'act-1',
        type: 'car',
        quantity: 32,
        date: new Date(Date.now() - 1000 * 60 * 60 * 18).toISOString().split('T')[0],
        emission: 6.40,
        note: 'Commute to regional client site'
      },
      {
        id: 'act-2',
        type: 'electricity',
        quantity: 12.5,
        date: new Date(Date.now() - 1000 * 60 * 60 * 36).toISOString().split('T')[0],
        emission: 10.05,
        note: 'Apartment daily power consumption'
      },
      {
        id: 'act-3',
        type: 'veg_meal',
        quantity: 3,
        date: new Date(Date.now() - 1000 * 60 * 60 * 42).toISOString().split('T')[0],
        emission: 1.50,
        note: 'Plant-based team lunch & home prep'
      },
      {
        id: 'act-4',
        type: 'bus',
        quantity: 18,
        date: new Date(Date.now() - 1000 * 60 * 60 * 85).toISOString().split('T')[0],
        emission: 1.44,
        note: 'Metro express to downtown co-working'
      },
      {
        id: 'act-5',
        type: 'non_veg_meal',
        quantity: 1,
        date: new Date(Date.now() - 1000 * 60 * 60 * 110).toISOString().split('T')[0],
        emission: 2.00,
        note: 'Family dinner steak'
      }
    ];

    function getCurrentWeekBounds() {
      const now = new Date();
      const currentDay = now.getDay();
      const distanceToMon = (currentDay + 6) % 7;
      const monday = new Date(now);
      monday.setDate(now.getDate() - distanceToMon);
      monday.setHours(0, 0, 0, 0);

      const sunday = new Date(monday);
      sunday.setDate(monday.getDate() + 6);
      sunday.setHours(23, 59, 59, 999);

      return { monday, sunday };
    }

    function App() {
      const [activities, setActivities] = useState(INITIAL_ACTIVITIES);
      const [targetCO2, setTargetCO2] = useState(30.0);
      
      // Calm & organic Threshold Alert Modal state
      const [showThresholdModal, setShowThresholdModal] = useState(true);
      const [rolloverApplied, setRolloverApplied] = useState(false);

      const [activityType, setActivityType] = useState('car');
      const [quantityInput, setQuantityInput] = useState('');
      const [activityDate, setActivityDate] = useState(new Date().toISOString().split('T')[0]);
      const [activityNote, setActivityNote] = useState('');
      const [formError, setFormError] = useState('');

      const [toast, setToast] = useState(null);
      const [filterType, setFilterType] = useState('ALL');
      const [searchQuery, setSearchQuery] = useState('');

      useEffect(() => {
        if (!toast) return;
        const timer = setTimeout(() => setToast(null), 3500);
        return () => clearTimeout(timer);
      }, [toast]);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      const weekBounds = useMemo(() => getCurrentWeekBounds(), []);

      const isActivityInCurrentWeek = (dateStr) => {
        const itemDate = new Date(dateStr + 'T00:00:00');
        return itemDate >= weekBounds.monday && itemDate <= weekBounds.sunday;
      };

      const weeklyTotalCO2 = 34.2;

      const categoryBreakdown = useMemo(() => {
        return [
          { name: 'Flight', emission: 16.25, color: '#8C6824' },
          { name: 'Electricity', emission: 10.05, color: '#74C043' },
          { name: 'Car travel', emission: 6.40, color: '#132B20' },
          { name: 'Veg meal', emission: 1.50, color: '#2F4F2F' }
        ];
      }, []);

      const filteredActivities = useMemo(() => {
        return activities.filter(act => {
          if (filterType !== 'ALL' && act.type !== filterType) return false;
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            const label = EMISSION_FACTORS[act.type]?.label.toLowerCase() || '';
            const note = (act.note || '').toLowerCase();
            if (!label.includes(q) && !note.includes(q)) return false;
          }
          return true;
        });
      }, [activities, filterType, searchQuery]);

      const handleQuickSubmit = (e) => {
        if (e && e.preventDefault) e.preventDefault();
        setFormError('');

        const factorConfig = EMISSION_FACTORS[activityType];
        const val = parseFloat(quantityInput);
        if (isNaN(val) || val <= 0) {
          setFormError('Enter a valid positive number.');
          return;
        }

        const emission = parseFloat((factorConfig.rate * val).toFixed(2));
        const newEntry = {
          id: 'act-' + Date.now(),
          type: activityType,
          quantity: val,
          date: activityDate || new Date().toISOString().split('T')[0],
          emission,
          note: activityNote.trim() || undefined
        };

        setActivities(prev => [newEntry, ...prev]);
        setToast({
          message: `+${emission.toFixed(1)} kg CO₂ logged`,
          subtext: `${factorConfig.label} added to telemetry.`
        });
        setQuantityInput('');
        setActivityNote('');
      };

      const handleDelete = (id) => {
        const item = activities.find(a => a.id === id);
        setActivities(prev => prev.filter(a => a.id !== id));
        if (item) {
          setToast({
            message: `Removed ${item.emission.toFixed(1)} kg entry`,
            subtext: `${EMISSION_FACTORS[item.type]?.label || 'Activity'} deleted.`
          });
        }
      };

      const handleApplyRollover = () => {
        setRolloverApplied(true);
        setShowThresholdModal(false);
        setToast({
          message: "Rollover Applied: -4.2 kg to Next Week",
          subtext: "Next week allowance adjusted from 30.0 kg → 25.8 kg CO₂."
        });
      };

      const handleDismissModal = () => {
        setShowThresholdModal(false);
        setToast({
          message: "Budget Pacing Noted",
          subtext: "Allowance kept at standard 30.0 kg target."
        });
      };

      return (
        <div className="w-full h-full flex flex-col justify-between p-3 sm:p-5 lg:p-6 max-w-[1680px] mx-auto relative">
          
          {/* TOP AGRONE FLOATING NAVBAR */}
          <header className="w-full mb-3 lg:mb-4">
            <nav className="bg-[#F5F2EB]/95 backdrop-blur-md rounded-full px-3 sm:px-6 py-2 sm:py-2.5 flex items-center justify-between border border-white/80 shadow-md">
              
              {/* Left: Brand Pill */}
              <div className="flex items-center space-x-2.5">
                <div className="w-9 h-9 rounded-full bg-[#132B20] flex items-center justify-center text-[#74C043] shadow-inner">
                  <svg className="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
                    <circle cx="7" cy="7" r="3" />
                    <circle cx="17" cy="7" r="3" fill="#85D450"/>
                    <circle cx="7" cy="17" r="3" fill="#85D450"/>
                    <circle cx="17" cy="17" r="3" />
                  </svg>
                </div>
                <div className="flex items-center space-x-1.5">
                  <span className="font-extrabold text-base sm:text-lg tracking-tight text-[#132B20]">PlanetPulse</span>
                  <span className="hidden md:inline-block text-[10px] font-bold px-2 py-0.5 rounded-full bg-[#74C043]/20 text-[#132B20] border border-[#74C043]/30 uppercase tracking-wider">
                    Climate Tech
                  </span>
                </div>
              </div>

              {/* Center Menu Pills */}
              <div className="hidden md:flex items-center space-x-1 text-xs font-semibold text-[#132B20]/80">
                <a href="#overview" className="px-3.5 py-1.5 rounded-full bg-white/70 text-[#132B20] shadow-xs">Overview</a>
                <a href="#footprint" className="px-3.5 py-1.5 rounded-full hover:bg-white/50 transition">Footprint</a>
                <a href="#log-activity" className="px-3.5 py-1.5 rounded-full hover:bg-white/50 transition">Log Activity</a>
                <a href="#telemetry-audit" className="px-3.5 py-1.5 rounded-full hover:bg-white/50 transition">Audit Trail</a>
              </div>

              {/* Right: Search Pill + Calm Soft Amber/Olive Over Budget Status Badge */}
              <div className="flex items-center space-x-2 sm:space-x-3">
                <div className="hidden sm:flex items-center space-x-2 bg-white/70 border border-[#132B20]/10 px-3 py-1.5 rounded-full text-xs text-[#132B20]">
                  <i data-lucide="search" className="w-3.5 h-3.5 text-[#132B20]/50"></i>
                  <input
                    type="text"
                    placeholder="Search telemetry..."
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="bg-transparent text-xs text-[#132B20] placeholder-[#132B20]/40 focus:outline-none w-24 lg:w-32 font-medium"
                  />
                </div>

                {/* Over Budget Badge with soft warm amber/olive tone instead of glaring red */}
                <button
                  onClick={() => setShowThresholdModal(true)}
                  className="flex items-center space-x-1.5 px-3.5 py-1.5 rounded-full text-xs font-semibold transition border shadow-xs bg-[#EFE9DC] hover:bg-[#E6DEC9] text-[#132B20] border-[#D9D1BF] cursor-pointer"
                  title="Click to review threshold rebalancing"
                >
                  <span className="w-2 h-2 rounded-full bg-[#8C6824]"></span>
                  <span className="font-bold tracking-tight text-[#132B20]">Target Reached (+4.2 kg)</span>
                </button>
              </div>
            </nav>
          </header>

          {/* Toast Notification */}
          {toast && (
            <div className="fixed top-20 right-8 z-50 transition-all duration-300">
              <div className="bg-[#F5F2EB] border border-[#C8D9CB] text-[#132B20] px-4 py-2.5 rounded-2xl agrone-card-shadow flex items-center space-x-3 text-xs font-semibold">
                <span className="w-5 h-5 rounded-full bg-[#E3EDE5] flex items-center justify-center text-[#132B20]">
                  <i data-lucide="leaf" className="w-3 h-3 stroke-[2.5]"></i>
                </span>
                <div>
                  <span className="font-bold">{toast.message}</span> — <span className="opacity-75">{toast.subtext}</span>
                </div>
              </div>
            </div>
          )}

          {/* MAIN BALANCED HORIZONTAL VIEWPORT LAYOUT */}
          <main className="w-full flex-1 grid grid-cols-1 xl:grid-cols-12 gap-4 lg:gap-6 items-stretch my-auto">
            
            {/* LEFT COLUMN: Hero text + Weekly Telemetry & Activity Logger Card */}
            <div className="xl:col-span-6 flex flex-col justify-between space-y-4 lg:space-y-5">
              
              {/* Hero Typography & CTA */}
              <div className="space-y-3 px-2 pt-1">
                <div className="inline-flex items-center space-x-2 bg-white/25 backdrop-blur-md px-3 py-1 rounded-full text-white text-xs font-semibold border border-white/30">
                  <span className="w-2 h-2 rounded-full bg-[#85D450]"></span>
                  <span>Weekly Budget Pacing Companion</span>
                </div>

                <h1 className="text-3xl sm:text-5xl lg:text-[54px] font-extrabold text-white leading-[1.06] tracking-tight drop-shadow-md">
                  Part of future <br/>
                  <span className="inline-flex items-center space-x-3">
                    <span className="text-white">Climate Action</span>
                    <span className="inline-flex items-center justify-center w-10 h-10 sm:w-12 sm:h-12 rounded-full bg-white/20 backdrop-blur border border-white/40 text-white shadow-inner">
                      <i data-lucide="sprout" className="w-5 h-5 sm:w-6 sm:h-6 text-[#85D450]"></i>
                    </span>
                  </span>
                </h1>

                <p className="text-white/90 text-xs sm:text-sm max-w-lg font-normal leading-relaxed drop-shadow-xs">
                  Track, compute, and curb your weekly footprint using verified IPCC emission factors. Rebalance emissions seamlessly with rollover accounting.
                </p>

                {/* Pill Action Buttons */}
                <div className="pt-1 flex flex-wrap items-center gap-3">
                  <button 
                    onClick={() => setShowThresholdModal(true)} 
                    className="inline-flex items-center space-x-2.5 bg-[#132B20] hover:bg-[#1a382a] text-white font-bold text-xs sm:text-sm px-5 py-2.5 rounded-full agrone-pill-shadow transition-all group shadow-lg border border-white/20"
                  >
                    <span>Review Rebalancing (-4.2 kg)</span>
                    <span className="w-6 h-6 rounded-full bg-white/20 text-white flex items-center justify-center transition-transform group-hover:rotate-45">
                      <i data-lucide="arrow-up-right" className="w-3.5 h-3.5 stroke-[2.5]"></i>
                    </span>
                  </button>

                  <a 
                    href="#telemetry-audit" 
                    className="inline-flex items-center space-x-2 bg-black/25 hover:bg-black/35 backdrop-blur text-white border border-white/30 text-xs font-semibold px-4 py-2.5 rounded-full transition"
                  >
                    <span>Review Audit History ({activities.length})</span>
                    <i data-lucide="chevron-right" className="w-3.5 h-3.5 text-[#85D450]"></i>
                  </a>
                </div>
              </div>

              {/* Bottom-Left Card: Weekly Telemetry & Quick Logger */}
              <div className="bg-[#F5F2EB] rounded-[32px] p-5 sm:p-6 agrone-card-shadow border border-white/80 relative flex flex-col justify-between space-y-4">
                
                {/* Corner Action Circle */}
                <div className="absolute top-4 right-4 sm:top-5 sm:right-5">
                  <div 
                    onClick={() => setShowThresholdModal(true)}
                    className="w-9 h-9 rounded-full bg-[#E3EDE5] text-[#132B20] flex items-center justify-center shadow-sm font-bold hover:scale-105 transition-transform cursor-pointer border border-[#C8D9CB]"
                    title="Pacing overview"
                  >
                    <i data-lucide="scale" className="w-4 h-4 stroke-[2]"></i>
                  </div>
                </div>

                {/* Telemetry Header */}
                <div className="flex items-center space-x-2 text-xs font-bold tracking-wider uppercase text-[#132B20]/70">
                  <div className="w-6 h-6 rounded-full bg-[#E3EDE5] flex items-center justify-center text-[#132B20]">
                    <i data-lucide="gauge" className="w-3.5 h-3.5"></i>
                  </div>
                  <span>Weekly Telemetry &amp; Quick Logger</span>
                </div>

                {/* Big Metric with Calm Olive Badge */}
                <div className="grid grid-cols-1 sm:grid-cols-12 gap-4 items-center">
                  <div className="sm:col-span-5">
                    <div className="flex items-baseline space-x-2 flex-wrap">
                      <span className="text-4xl sm:text-5xl font-extrabold tracking-tight text-[#132B20]">
                        {weeklyTotalCO2.toFixed(1)}
                      </span>
                      <span className="text-xl font-bold text-[#132B20]">kg CO₂</span>
                      <span className="inline-flex items-center px-2 py-0.5 rounded-full bg-[#EAE4D5] text-[#8C6824] border border-[#DDD5C0] text-[10px] font-bold uppercase tracking-wide ml-1">
                        +4.2 kg
                      </span>
                    </div>
                    <p className="text-[11px] font-semibold text-[#132B20]/60 uppercase tracking-wider mt-0.5">
                      Current week emissions (Limit: 30.0 kg)
                    </p>
                  </div>

                  <div className="sm:col-span-7 space-y-2">
                    <div className="flex justify-between items-center text-[11px] font-bold text-[#132B20]/75">
                      <span>Category Breakdown</span>
                      <span className="text-[#8C6824] font-bold">+4.2 kg balance</span>
                    </div>

                    {/* Progress Bar showing balanced tones */}
                    <div className="h-3 w-full rounded-full bg-[#DDD8CA] overflow-hidden flex p-0.5 border border-[#132B20]/10">
                      {categoryBreakdown.map((cat, idx) => {
                        const pct = (cat.emission / weeklyTotalCO2) * 100;
                        return (
                          <div 
                            key={idx}
                            style={{ width: `${pct}%`, backgroundColor: cat.color }}
                            title={`${cat.name}: ${cat.emission.toFixed(1)} kg`}
                            className="h-full first:rounded-l-full last:rounded-r-full transition-all duration-300"
                          />
                        );
                      })}
                    </div>

                    {/* Breakdown pills */}
                    <div className="flex flex-wrap gap-1.5 pt-0.5">
                      {categoryBreakdown.map((cat, idx) => (
                        <span key={idx} className="inline-flex items-center space-x-1 text-[10px] px-2 py-0.5 rounded-full bg-[#EAE6DA] font-semibold text-[#132B20]">
                          <span className="w-1.5 h-1.5 rounded-full" style={{ backgroundColor: cat.color }}></span>
                          <span>{cat.name}: {cat.emission.toFixed(1)}kg</span>
                        </span>
                      ))}
                    </div>
                  </div>
                </div>

                {/* Compact Logger Form */}
                <form id="quick-log" onSubmit={handleQuickSubmit} className="pt-3 border-t border-[#132B20]/10 space-y-2.5">
                  <div className="grid grid-cols-12 gap-2 sm:gap-3">
                    <div className="col-span-12 sm:col-span-5">
                      <label className="block text-[10px] font-bold uppercase tracking-wider text-[#132B20]/70 mb-1">
                        Activity
                      </label>
                      <select
                        value={activityType}
                        onChange={(e) => setActivityType(e.target.value)}
                        className="agrone-input w-full px-3 py-2 rounded-xl text-xs font-bold text-[#132B20] cursor-pointer"
                      >
                        <option value="car">Car travel (0.20 kg/km)</option>
                        <option value="bus">Bus travel (0.08 kg/km)</option>
                        <option value="flight">Flight (0.25 kg/km)</option>
                        <option value="electricity">Electricity (0.80 kg/kWh)</option>
                        <option value="veg_meal">Veg meal (0.50 kg/meal)</option>
                        <option value="non_veg_meal">Non-veg meal (2.00 kg/meal)</option>
                      </select>
                    </div>

                    <div className="col-span-6 sm:col-span-3">
                      <label className="block text-[10px] font-bold uppercase tracking-wider text-[#132B20]/70 mb-1">
                        Qty ({EMISSION_FACTORS[activityType]?.unit})
                      </label>
                      <input
                        type="number"
                        step="any"
                        placeholder="e.g. 24"
                        value={quantityInput}
                        onChange={(e) => setQuantityInput(e.target.value)}
                        className="agrone-input w-full px-3 py-2 rounded-xl text-xs font-bold text-[#132B20]"
                      />
                    </div>

                    <div className="col-span-6 sm:col-span-4">
                      <label className="block text-[10px] font-bold uppercase tracking-wider text-[#132B20]/70 mb-1">
                        Note / Label
                      </label>
                      <input
                        type="text"
                        placeholder="e.g. Commute"
                        value={activityNote}
                        onChange={(e) => setActivityNote(e.target.value)}
                        className="agrone-input w-full px-3 py-2 rounded-xl text-xs text-[#132B20]"
                      />
                    </div>
                  </div>

                  <div className="flex items-center justify-between pt-1">
                    <div className="text-xs font-bold text-[#132B20]">
                      <span className="text-[11px] text-[#132B20]/60 font-normal">Est: </span>
                      <span className="text-sm font-extrabold text-[#132B20]">
                        {quantityInput && !isNaN(parseFloat(quantityInput)) && parseFloat(quantityInput) > 0
                          ? (parseFloat(quantityInput) * EMISSION_FACTORS[activityType].rate).toFixed(2)
                          : '0.00'}
                      </span>
                      <span className="text-[11px] text-[#74C043] ml-1 font-bold">kg CO₂</span>
                    </div>

                    {formError && (
                      <span className="text-[11px] text-[#8C6824] font-bold">{formError}</span>
                    )}

                    <button
                      type="submit"
                      className="inline-flex items-center space-x-2 bg-[#132B20] hover:bg-[#1f4331] text-white text-xs font-bold px-4 py-2 rounded-full agrone-pill-shadow transition-all group"
                    >
                      <span>Record Activity</span>
                      <span className="w-5 h-5 rounded-full bg-[#74C043] text-[#132B20] flex items-center justify-center group-hover:rotate-45 transition-transform">
                        <i data-lucide="plus" className="w-3.5 h-3.5 stroke-[3]"></i>
                      </span>
                    </button>
                  </div>
                </form>

              </div>
            </div>

            {/* RIGHT COLUMN: 
                Top: Target & Budget Card (Calm 114% with organic olive/forest styling)
                Bottom: Telemetry Log & Audit Trail
            */}

              {/* TOP-RIGHT CARD: Target & Budget Card */}

                {/* Gentle Pacing Button in Top-Right Corner */}
                <div 
                  onClick={() => setShowThresholdModal(true)}
                  className="absolute top-4 right-4 sm:top-5 sm:right-5 w-9 h-9 rounded-full bg-[#E3EDE5] text-[#132B20] flex items-center justify-center shadow-xs cursor-pointer hover:scale-105 transition-transform border border-[#C8D9CB]"
                  title="View Rebalancing Options"
                >
                  <i data-lucide="sliders-horizontal" className="w-4 h-4"></i>
                </div>

                <div className="space-y-3">
                  {/* Header */}
                  <div className="flex items-center justify-between pr-10">
                    <div className="flex items-center space-x-2">
                      <span className="text-xs font-bold uppercase tracking-wider text-[#132B20]/75">
                        Weekly Budget &amp; Target
                      </span>
                      <span className="px-2.5 py-0.5 rounded-full bg-[#EAE4D5] text-[#8C6824] border border-[#DDD5C0] text-[10px] font-bold uppercase tracking-wider">
                        Goal Reached
                      </span>
                    </div>
                    
                    <button 
                      onClick={() => setShowThresholdModal(true)}
                      className="text-[11px] font-bold text-[#132B20] hover:text-white bg-[#EAE6DA] hover:bg-[#132B20] px-3 py-1 rounded-full border border-[#D9D1BF] transition"
                    >
                      Rebalance Allowance
                    </button>
                  </div>

                  {/* Headline */}
                  <div>
                    <div className="flex items-baseline space-x-2 flex-wrap">
                      <span className="text-4xl sm:text-5xl font-extrabold tracking-tight text-[#132B20]">
                        114%
                      </span>
                      <span className="text-xl sm:text-2xl font-bold text-[#132B20]/90">
                        of Weekly Target
                      </span>
                    </div>
                    {/* Subtitle */}
                    <p className="text-xs font-semibold text-[#132B20]/75 mt-0.5">
                      34.2 kg logged of 30.0 kg weekly allowance
                    </p>
                  </div>

                  {/* Progress meter: Deep forest green with calm warm ochre/moss overflow segment */}
                  <div className="space-y-1.5">
                    <div className="w-full bg-[#132B20]/15 h-3.5 rounded-full overflow-hidden p-0.5 flex">
                      {/* 100% Allowance in Forest Green */}
                      <div 
                        className="h-full rounded-l-full bg-[#132B20] transition-all duration-500 flex items-center justify-end pr-1"
                        style={{ width: '87.7%' }}
                        title="30.0 kg baseline allowance (100%)"
                      >
                        <span className="text-[8px] text-white/80 font-bold hidden sm:inline">100% (30 kg)</span>
                      </div>
                      {/* Overflow segment in warm earthy amber */}
                      <div 
                        className="h-full rounded-r-full bg-[#8C6824] transition-all duration-500 flex items-center justify-center"
                        style={{ width: '12.3%' }}
                        title="+4.2 kg balance"
                      >
                        <span className="text-[8px] text-white font-bold hidden sm:inline">+4.2kg</span>
                      </div>
                    </div>
                    
                    <div className="flex justify-between items-center text-[10px] font-bold text-[#132B20]/70 px-1">
                      <span className="text-[#132B20] font-bold">0 kg baseline</span>
                      <span className="text-[#132B20] font-bold">30.0 kg target</span>
                      <span className="text-[#8C6824] font-bold">+4.2 kg balance (34.2 kg total)</span>
                    </div>
                  </div>

                  {/* Status note & Days Remaining */}
                  <div className="pt-2 border-t border-[#132B20]/15 flex flex-col sm:flex-row sm:items-center justify-between gap-1.5 text-xs">
                    <div className="flex items-center space-x-1.5 font-medium text-[#132B20]/80">
                      <i data-lucide="calendar" className="w-3.5 h-3.5 text-[#2F4F2F]"></i>
                      <span>Pacing note: Target reached by 4.2 kg with 2 days remaining in cycle.</span>
                    </div>
                    <span className="font-bold px-3 py-1 rounded-full bg-[#EAE4D5] text-[#8C6824] border border-[#DDD5C0] text-[11px] self-start sm:self-auto">
                      +4.2 kg balance
                    </span>
                  </div>

                  {/* Pacing recommendation callout */}
                  <div className="text-[11px] text-[#132B20] font-medium leading-relaxed bg-[#EAE6DA]/80 border border-[#D9D1BF] p-2.5 rounded-2xl flex items-center justify-between">
                    <div className="flex items-center space-x-2">
                      <span className="w-5 h-5 rounded-full bg-[#E3EDE5] flex items-center justify-center text-[#132B20] text-xs">🌱</span>
                      <span>
                        {rolloverApplied 
                          ? "Rebalancing active: -4.2 kg scheduled for next week's allowance (new target: 25.8 kg)."
                          : "4.2 kg logged above baseline today. You can comfortably rebalance into next week's cycle."}
                      </span>
                    </div>
                    {!rolloverApplied && (
                      <button
                        onClick={() => setShowThresholdModal(true)}
                        className="ml-2 whitespace-nowrap text-[10px] font-bold bg-[#132B20] text-white px-2.5 py-1 rounded-full hover:bg-[#1a382a] transition"
                      >
                        Rebalance
                      </button>
                    )}
                  </div>
                </div>

              </div>

              {/* BOTTOM-RIGHT CARD: Telemetry Log & Audit Trail */}
              <div id="telemetry-audit" className="bg-[#F5F2EB] rounded-[32px] p-5 sm:p-6 agrone-card-shadow border border-white/80 flex flex-col justify-between space-y-3">
                
                {/* Header & Filter Tabs */}
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-2 border-b border-[#132B20]/10">
                  <div className="flex items-center space-x-2">
                    <h3 className="text-base font-extrabold text-[#132B20] tracking-tight">Telemetry Log &amp; Audit</h3>
                    <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-[#E3EDE5] text-[#132B20] border border-[#C8D9CB]">
                      {filteredActivities.length} logs
                    </span>
                  </div>

                  {/* Filter Pills */}
                  <div className="flex items-center space-x-1 text-[11px] font-bold">
                    {['ALL', 'flight', 'car', 'electricity', 'veg_meal'].map((f) => (
                      <button
                        key={f}
                        onClick={() => setFilterType(f)}
                        className={`px-2.5 py-1 rounded-full transition ${
                          filterType === f 
                            ? 'bg-[#132B20] text-white' 
                            : 'bg-[#EAE6DA] text-[#132B20]/75 hover:bg-[#DDD8CA]'
                        }`}
                      >
                        {f === 'ALL' ? 'All' : (f === 'flight' ? 'Flights' : (f === 'car' ? 'Car' : (f === 'electricity' ? 'Elec' : 'Veg')))}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Audit Table */}
                <div className="overflow-x-auto max-h-[220px] pr-1">

                    <thead>
                      <tr className="text-[10px] uppercase tracking-wider text-[#132B20]/60 font-extrabold border-b border-[#132B20]/10">
                        <th className="py-1.5 px-2">Activity</th>
                        <th className="py-1.5 px-2">Volume</th>
                        <th className="py-1.5 px-2">Factor</th>
                        <th className="py-1.5 px-2">Output</th>
                        <th className="py-1.5 px-2">Status</th>
                        <th className="py-1.5 px-2 text-right">Action</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-[#132B20]/10">
                      {filteredActivities.length === 0 ? (
                        <tr>
                          <td colSpan="6" className="py-6 text-center text-[#132B20]/50 italic">
                            No telemetry entries found for this category.
                          </td>
                        </tr>
                      ) : (
                        filteredActivities.map((item) => {
                          const config = EMISSION_FACTORS[item.type] || { rate: 0, unit: 'unit', label: item.type, icon: 'circle' };
                          const isBreach = item.isBreachTrigger;
                          
                          return (
                            <tr 
                              key={item.id} 
                              className={`transition ${isBreach ? 'bg-[#EAE4D5]/40 hover:bg-[#EAE4D5]/70 font-medium' : 'hover:bg-[#EAE6DA]/70'}`}
                            >
                              <td className="py-2 px-2 text-[#132B20] flex items-center space-x-2">
                                <span className="w-6 h-6 rounded-full flex items-center justify-center flex-shrink-0 bg-[#132B20] text-[#85D450]">
                                  <i data-lucide={config.icon || 'circle'} className="w-3 h-3"></i>
                                </span>
                                <div>
                                  <div className="font-bold text-xs text-[#132B20]">
                                    {config.label}
                                  </div>
                                  {item.note && (
                                    <div className="text-[10px] truncate max-w-[140px] text-[#132B20]/60">
                                      {item.note}
                                    </div>
                                  )}
                                </div>
                              </td>
                              <td className="py-2 px-2 font-bold text-[#132B20]">
                                {item.quantity} <span className="text-[10px] font-normal text-[#132B20]/60">{config.unit}</span>
                              </td>
                              <td className="py-2 px-2 text-[11px] text-[#132B20]/70 font-medium">
                                {config.rate.toFixed(2)}
                              </td>
                              <td className="py-2 px-2 font-extrabold text-[#132B20]">
                                {item.emission.toFixed(2)} <span className="text-[#2F4F2F] font-bold text-[10px]">kg</span>
                              </td>
                              <td className="py-2 px-2">
                                {isBreach ? (
                                  <span className="px-2 py-0.5 rounded-full bg-[#EAE4D5] text-[#8C6824] border border-[#DDD5C0] text-[9px] font-bold uppercase tracking-wide">
                                    Target Balance
                                  </span>
                                ) : (
                                  <span className="px-2 py-0.5 rounded-full bg-[#74C043]/20 text-[#132B20] border border-[#74C043]/30 text-[9px] font-bold">
                                    Current
                                  </span>
                                )}
                              </td>
                              <td className="py-2 px-2 text-right">
                                <button
                                  onClick={() => handleDelete(item.id)}
                                  title="Delete item"
                                  className="w-6 h-6 rounded-full hover:bg-[#132B20]/10 text-[#132B20]/40 hover:text-[#132B20] transition inline-flex items-center justify-center"
                                >
                                  <i data-lucide="trash-2" className="w-3 h-3"></i>
                                </button>
                              </td>
                            </tr>
                          );
                        })
                      )}
                    </tbody>
                  </table>
                </div>

                {/* Equivalence Footer */}
                <div className="pt-2 border-t border-[#132B20]/10 flex items-center justify-between text-[11px] text-[#132B20]/75 font-medium">
                  <div className="flex items-center space-x-1.5">
                    <i data-lucide="shield-check" className="w-3.5 h-3.5 text-[#2F4F2F]"></i>
                    <span>IPCC Tier 1 Telemetry: Rolling Weekly Audit Trail</span>
                  </div>
                  <span className="text-[#132B20]/80 font-semibold">Active telemetry cycle</span>
                </div>

              </div>

            </div>

          </main>

          {/* FLOATING BOTTOM PILL FOOTER */}
          <footer className="w-full mt-3 lg:mt-4">
            <div className="bg-[#F5F2EB]/95 backdrop-blur-md rounded-full px-5 py-2.5 flex flex-col sm:flex-row items-center justify-between text-xs font-semibold text-[#132B20] border border-white/80 shadow-md gap-2">
              <div className="flex items-center space-x-2">
                <span className="font-extrabold">PlanetPulse</span>
                <span className="text-[#132B20]/40">—</span>
                <span className="text-[#132B20]/80">Part of Future Climate Action</span>
              </div>
              <div className="flex items-center space-x-3 text-[11px] text-[#132B20]/70 font-semibold">
                <span>IPCC Verified</span>
                <span>•</span>
                <span>Plus Jakarta Sans</span>
                <span>•</span>
                <span className="text-[#132B20] font-bold">Weekly Balance (+4.2 kg)</span>
              </div>
            </div>
          </footer>

          {/* SUBTLE, CALM & ORGANIC THRESHOLD PACING MODAL */}
          {showThresholdModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 agrone-modal-backdrop animate-fade-in">
              <div className="bg-[#F9F7F2] rounded-[36px] max-w-xl w-full p-6 sm:p-8 agrone-card-shadow border border-[#E6E1D7] text-[#132B20] relative space-y-5">
                
                {/* Subtle Close 'X' pill with elegant hover */}
                <button 
                  onClick={handleDismissModal}
                  className="absolute top-5 right-5 w-8 h-8 rounded-full bg-[#132B20]/5 hover:bg-[#132B20]/15 flex items-center justify-center text-[#132B20]/70 hover:text-[#132B20] transition-colors"
                  title="Close"
                >
                  <i data-lucide="x" className="w-4 h-4"></i>
                </button>

                {/* Modal Header: Gentle organic circular badge + Muted Sage Category Pill */}
                <div className="flex items-start space-x-3.5 pr-8">
                  <div className="w-12 h-12 rounded-full bg-[#E3EDE5] border border-[#C8D9CB] text-[#132B20] flex items-center justify-center flex-shrink-0 shadow-xs">
                    <i data-lucide="scale" className="w-5 h-5 stroke-[2]"></i>
                  </div>
                  <div>
                    <span className="inline-block text-[10px] font-bold uppercase tracking-wider px-2.5 py-0.5 rounded-full bg-[#E3EDE5] text-[#132B20] border border-[#C8D9CB] mb-1.5">
                      Weekly Budget Pacing
                    </span>
                    {/* Clean headline without alarming warning emoji */}
                    <h2 className="text-xl sm:text-2xl font-bold text-[#132B20] tracking-tight leading-snug">
                      Weekly Allowance Reached
                    </h2>
                  </div>
                </div>

                {/* Modal Body: Calm, encouraging climate companion text */}
                <div className="space-y-4 text-xs sm:text-sm text-[#132B20]">
                  <p className="leading-relaxed bg-white/70 p-4 rounded-2xl border border-[#E6E1D7] text-[#132B20]/90">
                    You have reached <strong className="text-[#132B20] font-extrabold">34.2 kg CO₂</strong> against your <strong className="text-[#132B20] font-bold">30.0 kg</strong> weekly target (<span className="text-[#2F4F2F] font-bold">+4.2 kg balance</span>). You can easily rebalance your footprint in next week's budget.
                  </p>

                  {/* Compensation Card Box: Soft linen/cream container with delicate border */}
                  <div className="bg-[#F0ECE1] rounded-2xl p-4 border border-[#E6E1D7] space-y-3">
                    <div className="flex items-center space-x-2 text-xs font-bold text-[#2F4F2F] uppercase tracking-wider">
                      <i data-lucide="repeat" className="w-4 h-4 stroke-[2]"></i>
                      <span>Rebalance with Next Week's Budget</span>
                    </div>

                    <p className="text-xs text-[#132B20]/80 leading-relaxed">
                      Deduct 4.2 kg excess from next week's allowance (target reduces from <strong>30.0 kg → 25.8 kg CO₂</strong>) to keep your monthly climate pledge smoothly on track.
                    </p>

                    {/* Clean Warm White Cards */}
                    <div className="grid grid-cols-2 gap-2.5 pt-1">
                      <div className="bg-white rounded-xl p-3 border border-[#E6E1D7] shadow-xs">
                        <span className="block text-[10px] uppercase font-bold text-[#132B20]/60 tracking-wider">Current Balance</span>
                        <span className="text-base font-extrabold text-[#132B20] mt-0.5 block">+4.2 kg CO₂</span>
                      </div>
                      <div className="bg-white rounded-xl p-3 border border-[#E6E1D7] shadow-xs">
                        <span className="block text-[10px] uppercase font-bold text-[#132B20]/60 tracking-wider">Next Week Target</span>
                        <span className="text-base font-extrabold text-[#132B20] mt-0.5 block">25.8 kg CO₂</span>
                      </div>
                    </div>
                  </div>
                </div>

                {/* Action Buttons */}
                <div className="pt-2 flex flex-col sm:flex-row items-center justify-end gap-2.5 border-t border-[#E6E1D7]">
                  {/* Secondary button: Soft cream/neutral border pill */}
                  <button
                    onClick={handleDismissModal}
                    className="w-full sm:w-auto px-4 py-2.5 rounded-full border border-[#132B20]/20 text-[#132B20] text-xs font-semibold hover:bg-[#132B20]/5 transition-colors text-center"
                  >
                    Keep 30 kg Target
                  </button>

                  {/* Primary action button: Deep forest green with smooth pill radius */}
                  <button
                    onClick={handleApplyRollover}
                    className="w-full sm:w-auto inline-flex items-center justify-center space-x-2 bg-[#132B20] hover:bg-[#1f4331] text-white text-xs font-bold px-5 py-2.5 rounded-full agrone-pill-shadow transition-all shadow-md group"
                  >
                    <span>✓ Apply -4.2 kg Rollover to Next Week</span>
                    <i data-lucide="arrow-right" className="w-3.5 h-3.5 group-hover:translate-x-0.5 transition-transform"></i>
                  </button>
                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
